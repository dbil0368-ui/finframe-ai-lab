name: VYBORA checks
on:
  pull_request:
    branches: [feature/global-trend-radar]
  push:
    branches: [feature/global-trend-radar, fix/vybora-launch-readiness]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm test
